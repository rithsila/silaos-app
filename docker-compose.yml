services:
  silaos:
    build:
      context: .
      dockerfile: Dockerfile
    image: silaos
    container_name: silaos
    restart: unless-stopped
    init: true
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "file:/app/data/prod.db"
      BACKEND_URL: "http://localhost:8080"
      AGENT_URL: "http://localhost:8081"
      AGENT_DATA_DIR: "/app/data/agent"
      AGENT_PROVIDER: "${AGENT_PROVIDER:-}"
      AGENT_MODEL: "${AGENT_MODEL:-}"
      AGENT_BASE_URL: "${AGENT_BASE_URL:-}"
      AGENT_API_KEY: "${AGENT_API_KEY:-}"
      # Optional: set API_KEY to require Bearer token on all /api/* requests
      # API_KEY: ""
      # Optional: restrict CORS to a specific origin
      # ALLOWED_ORIGIN: "https://yourdomain.com"
    volumes:
      - silaos-data:/app/data
    healthcheck:
      test: >
        curl -sf http://localhost:3000/ > /dev/null &&
        curl -sf http://localhost:8080/health > /dev/null &&
        curl -sf http://localhost:8081/health > /dev/null
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

volumes:
  silaos-data:
